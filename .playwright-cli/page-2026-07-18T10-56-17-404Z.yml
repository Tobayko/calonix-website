            - paragraph [ref=e144]: Automatische Erkennung ersetzt nicht die Prüfung. Unsichere Daten bleiben sichtbar und korrigierbar.
          - article [ref=e145]:
            - heading "Folgeschritte verbinden" [level=3] [ref=e146]
            - paragraph [ref=e147]: Raumheizlast, Material und hydraulische Werte basieren auf derselben Projektstruktur.
          - article [ref=e148]:
            - heading "Praxisfeedback geben" [level=3] [ref=e149]
            - paragraph [ref=e150]: Beta-Tester prüfen Prometo mit echten Projekten und melden Abweichungen direkt zurück.

            - generic [ref=e85]: Was dabei passiert
            - heading "Der Zeitgewinn entsteht vor der Berechnung." [level=2] [ref=e86]
            - paragraph [ref=e87]: In vielen SHK-Betrieben werden Räume, Geometrien und Bauteile aus vorhandenen Plänen erneut in mehrere Programme übertragen. Prometo beginnt beim PDF und hält die Daten im weiteren Ablauf zusammen.
          - list [ref=e88]:
            - listitem [ref=e89]: Grundriss als vorhandene Projektquelle weiterverwenden
            - listitem [ref=e90]: Erkannte Räume statt kompletter Neuerfassung kontrollieren
            - listitem [ref=e91]: Raumdaten einmal prüfen und mehrfach weiterverwenden
            - listitem [ref=e92]: Abweichungen und unsichere Angaben vor der Berechnung korrigieren

          - heading "Einheitliche Projektdaten statt individueller Insellösungen." [level=2] [ref=e155]
          - paragraph [ref=e156]: Prometo ist auch für Betriebe mit vielen Mitarbeitenden gedacht. Entscheidend ist dabei nicht eine separate Enterprise-Version, sondern ein konsistenter Berechnungsweg.
        - list [ref=e157]:

          - paragraph [ref=e82]: Beispielwert für ein typisches Einfamilienhaus mit geeignetem PDF-Grundriss. Die tatsächliche Dauer hängt von Planqualität, Gebäudeumfang und notwendigem Korrekturbedarf ab.
        - generic [ref=e83]:

          - paragraph [ref=e178]: "Prometo ist keine pauschal „bessere“ Plattform. Der Schwerpunkt ist ein anderer: vorhandene Grundrisse direkt weiterverwenden und Heizlast, Material sowie Abgleich in einem fokussierten Workflow verbinden."
        - generic [ref=e179]:

          - paragraph [ref=e167]: Gesucht werden SHK-Betriebe mit regelmäßigen EFH-, Sanierungs- oder Wärmepumpenprojekten, die ihren heutigen Berechnungsweg konkret mit Prometo vergleichen.
          - link "Kostenlos Beta testen" [ref=e168] [cursor=pointer]:
            - /url: /beta/
        - generic [ref=e169]:
          - strong [ref=e170]: Was Beta hier bedeutet
          - paragraph [ref=e171]: Kernworkflow, Plan-Import, Raumerkennung, Berechnung und Folgeübergaben sind nutzbar. Automatisch erkannte Daten müssen kontrolliert werden. Einzelne Exportformate, Sonderfälle und Randbedingungen sind noch Gegenstand der fachlichen Prüfung.
          - paragraph [ref=e172]: Die Beta ist kostenlos. Sie ersetzt nicht die Verantwortung qualifizierter Anwender für Eingaben, Plausibilität und projektspezifische Nachweise.
    - region [ref=e173]:

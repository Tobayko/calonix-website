        - generic [ref=e20]: PDF-Aufmaß für SHK-Betriebe · Kostenlose Beta
        - heading "Digitales Aufmaß direkt aus dem PDF-Grundriss." [level=1] [ref=e21]
        - paragraph [ref=e22]: Prometo erkennt Räume und Geometrien automatisch. Du kontrollierst das Aufmaß und nutzt die geprüften Daten direkt für Heizlast, Materialbedarf und hydraulischen Abgleich.
        - generic [ref=e23]:
          - link "Kostenlos Beta testen" [ref=e24] [cursor=pointer]:
            - /url: /beta/
          - link "Workflow ansehen" [ref=e25] [cursor=pointer]:
            - /url: "#workflow"
        - paragraph [ref=e26]: Bei einem geeigneten PDF-Grundriss kann ein typisches Einfamilienhaus in unter 7 Minuten bis zur Heizlast berechnet werden. Die tatsächliche Dauer hängt von Planqualität, Gebäudeumfang und notwendigem Korrekturbedarf ab.
      - figure [ref=e27]:
        - img "Prometo Import-Review auf dem Tablet mit automatisch erkannten und kontrollierbaren Räumen" [ref=e28]
        - generic [ref=e29]:
          - strong [ref=e30]: Raumerkennung mit Review
          - text: Automatisch erkannte Räume bleiben vor der Berechnung vollständig kontrollierbar.

          - button "Orientiert sich Prometo an der DIN EN 12831?" [ref=f1e423] [cursor=pointer]:
            - generic [ref=f1e425]: +
          - paragraph [ref=f1e428]: Prometo kann Eingaben und Prüfschritte entlang der DIN EN 12831 strukturieren. Eine Garantie auf DIN-Konformität wird nicht behauptet; Berechnung und Bewertung müssen qualifizierte Personen fachlich prüfen.
        - generic [ref=f1e429]:

          - paragraph [ref=f1e435]: Du wählst einen PDF-Bauplan aus und prüfst die daraus übernommenen Raumdaten vor der weiteren Verwendung. Je nach Planqualität bleiben manuelle Korrekturen Teil des Workflows.
        - generic [ref=f1e436]:
          - button "Erkennt Prometo jeden PDF-Grundriss automatisch?" [ref=f1e437] [cursor=pointer]:
            - generic [ref=f1e439]: +
          - paragraph [ref=f1e442]: Nein. Die Qualität der Erkennung hängt von Lesbarkeit, Maßstab, Planaufbau und enthaltenen Informationen ab. Erkannte Räume und Geometrien müssen vor der Berechnung kontrolliert und bei Bedarf korrigiert werden.
        - generic [ref=f1e443]:

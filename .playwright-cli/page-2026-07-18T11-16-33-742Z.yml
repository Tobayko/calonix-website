            - heading "Zusammenhänge statt isolierter Eingabemasken." [level=2] [ref=f4e81]
            - paragraph [ref=f4e82]: Lernende sehen nicht nur ein Endergebnis. Sie verfolgen, wie Grundriss, Raumgeometrie, Bauteile und Systemdaten zusammenwirken und wo fachliche Kontrolle nötig ist.

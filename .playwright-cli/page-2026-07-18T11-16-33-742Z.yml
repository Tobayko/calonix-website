          - heading "Vom Plan zur begründeten fachlichen Entscheidung." [level=2] [ref=f4e56]
          - paragraph [ref=f4e57]: Der PDF-Grundriss bildet eine gemeinsame Projektbasis. Lernende prüfen die erkannten Daten und sehen anschließend, welche Folgen Korrekturen für Berechnung und Auslegung haben.

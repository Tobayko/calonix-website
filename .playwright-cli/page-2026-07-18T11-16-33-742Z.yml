            - listitem [ref=f4e85]: Automatische Erkennung kritisch prüfen statt ungeprüft übernehmen
            - listitem [ref=f4e86]: Auswirkungen von Korrekturen auf Folgeergebnisse vergleichen
            - listitem [ref=f4e87]: Grenzen, Unsicherheiten und fachliche Verantwortung benennen

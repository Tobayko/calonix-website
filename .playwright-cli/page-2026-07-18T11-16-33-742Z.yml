          - generic [ref=f4e75]: 1 Projekt
          - paragraph [ref=f4e76]: Ein geeigneter Einfamilienhaus-Grundriss verbindet Aufmaß, Heizlast, Material und Abgleich in einer durchgängigen Aufgabe.

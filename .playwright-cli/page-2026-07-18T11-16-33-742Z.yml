        - generic [ref=f4e15]: Praxisbezug für SHK-Ausbildung · Separater Bereich
        - heading "Heizlast und Aufmaß anhand echter Grundrisse vermitteln." [level=1] [ref=f4e16]
        - paragraph [ref=f4e17]: Prometo ist professionelle SHK-Berechnungssoftware, keine Lern-App. Die Produktoberfläche macht sichtbar, wie aus einem PDF-Grundriss geprüfte Raumdaten, Heizlast, Materialbedarf und hydraulischer Abgleich entstehen.
        - generic [ref=f4e18]:
          - link "Kostenlos Beta testen" [ref=f4e19] [cursor=pointer]:
            - /url: /beta/
          - link "Workflow ansehen" [ref=f4e20] [cursor=pointer]:
            - /url: "#workflow"
        - paragraph [ref=f4e21]: Für Auszubildende, Berufsschulen, Meisterkurse und betriebliche Unterweisungen. Fachliche Anleitung, Kontrolle und Bewertung bleiben notwendig.
      - figure [ref=f4e22]:
        - img "Prometo Import-Review auf dem Tablet mit automatisch erkannten und kontrollierbaren Räumen" [ref=f4e23]
        - generic [ref=f4e24]:
          - strong [ref=f4e25]: Echte Produktoberfläche
          - text: Automatisch erkannte Räume lassen sich gemeinsam prüfen, korrigieren und weiterberechnen.

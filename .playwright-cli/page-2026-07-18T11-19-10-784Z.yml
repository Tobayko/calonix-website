          - paragraph [ref=f6e167]: Plan-Import, Raumerkennung, Berechnung und Folgeübergaben sind nutzbar. Automatisch erkannte Daten müssen kontrolliert werden. Einzelne Sonderfälle und Randbedingungen sind noch Gegenstand der fachlichen Prüfung.

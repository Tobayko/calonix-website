        - generic [ref=f6e15]: Praxisbezug für SHK-Ausbildung · Separater Bereich
        - heading "Heizlast und Aufmaß anhand echter Grundrisse vermitteln." [level=1] [ref=f6e16]
        - paragraph [ref=f6e17]: Prometo ist professionelle SHK-Berechnungssoftware, keine Lern-App. Die Produktoberfläche macht sichtbar, wie aus einem PDF-Grundriss geprüfte Raumdaten, Heizlast, Materialbedarf und hydraulischer Abgleich entstehen.
        - generic [ref=f6e18]:
          - link "Kostenlos Beta testen" [ref=f6e19] [cursor=pointer]:
            - /url: /beta/
          - link "Workflow ansehen" [ref=f6e20] [cursor=pointer]:
            - /url: "#workflow"
        - paragraph [ref=f6e21]: Für Auszubildende, Berufsschulen, Meisterkurse und betriebliche Unterweisungen. Fachliche Anleitung, Kontrolle und Bewertung bleiben notwendig.
      - figure [ref=f6e22]:
        - img "Prometo Import-Review auf dem Tablet mit automatisch erkannten und kontrollierbaren Räumen" [ref=f6e23]
        - generic [ref=f6e24]:
          - strong [ref=f6e25]: Echte Produktoberfläche
          - text: Automatisch erkannte Räume lassen sich gemeinsam prüfen, korrigieren und weiterberechnen.
    - region [ref=f6e26]:

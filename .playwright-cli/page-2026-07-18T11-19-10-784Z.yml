            - generic [ref=f6e39]:
              - heading "Raumweise Heizlast" [level=3] [ref=f6e40]
              - paragraph [ref=f6e41]: Verstehen, welche Raum- und Bauteildaten entlang der DIN EN 12831 in die Berechnung einfließen.
          - article [ref=f6e42]:

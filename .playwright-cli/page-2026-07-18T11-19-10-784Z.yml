          - heading "Vom Plan zur begründeten fachlichen Entscheidung." [level=2] [ref=f6e56]
          - paragraph [ref=f6e57]: Der PDF-Grundriss bildet eine gemeinsame Projektbasis. Lernende prüfen die erkannten Daten und sehen anschließend, welche Folgen Korrekturen für Berechnung und Auslegung haben.
        - generic [ref=f6e58]:
          - article [ref=f6e59]:
            - heading "PDF-Grundriss hochladen" [level=3] [ref=f6e60]
            - paragraph [ref=f6e61]: Einen geeigneten, lesbaren Grundriss als gemeinsame Ausgangslage verwenden.
          - article [ref=f6e62]:
            - heading "Räume automatisch erkennen" [level=3] [ref=f6e63]
            - paragraph [ref=f6e64]: Erkannte Raumstrukturen und Planinformationen gemeinsam bewerten.
          - article [ref=f6e65]:
            - heading "Annahmen begründen" [level=3] [ref=f6e66]
            - paragraph [ref=f6e67]: Raumgeometrien, Bauteile und Randbedingungen prüfen, diskutieren und korrigieren.
          - article [ref=f6e68]:

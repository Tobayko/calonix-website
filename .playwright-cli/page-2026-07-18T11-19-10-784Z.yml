          - generic [ref=f6e75]: 1 Projekt
          - paragraph [ref=f6e76]: Ein geeigneter Einfamilienhaus-Grundriss verbindet Aufmaß, Heizlast, Material und Abgleich in einer durchgängigen Aufgabe.
          - paragraph [ref=f6e77]: Automatisch erkannte Angaben sind Vorschläge. Sie müssen im Unterricht und im realen Projekt fachlich kontrolliert werden.
        - generic [ref=f6e78]:
          - generic [ref=f6e79]:
            - generic [ref=f6e80]: Was dabei verständlich wird
            - heading "Zusammenhänge statt isolierter Eingabemasken." [level=2] [ref=f6e81]
            - paragraph [ref=f6e82]: Lernende sehen nicht nur ein Endergebnis. Sie verfolgen, wie Grundriss, Raumgeometrie, Bauteile und Systemdaten zusammenwirken und wo fachliche Kontrolle nötig ist.
          - list [ref=f6e83]:
            - listitem [ref=f6e84]: Raum- und Bauteildaten direkt am Grundriss besprechen
            - listitem [ref=f6e85]: Automatische Erkennung kritisch prüfen statt ungeprüft übernehmen
            - listitem [ref=f6e86]: Auswirkungen von Korrekturen auf Folgeergebnisse vergleichen
            - listitem [ref=f6e87]: Grenzen, Unsicherheiten und fachliche Verantwortung benennen

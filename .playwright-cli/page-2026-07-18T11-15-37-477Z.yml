          - button "Orientiert sich Prometo an der DIN EN 12831?" [ref=f2e444] [cursor=pointer]:
            - generic [ref=f2e446]: +
          - paragraph [ref=f2e449]: Prometo kann Eingaben und Prüfschritte entlang der DIN EN 12831 strukturieren. Eine Garantie auf DIN-Konformität wird nicht behauptet; Berechnung und Bewertung müssen qualifizierte Personen fachlich prüfen.
        - generic [ref=f2e450]:
          - button "Wie funktioniert der PDF-Import für Baupläne?" [ref=f2e451] [cursor=pointer]:
            - generic [ref=f2e453]: +
          - paragraph [ref=f2e456]: Du wählst einen PDF-Bauplan aus und prüfst die daraus übernommenen Raumdaten vor der weiteren Verwendung. Je nach Planqualität bleiben manuelle Korrekturen Teil des Workflows.
        - generic [ref=f2e457]:
          - button "Erkennt Prometo jeden PDF-Grundriss automatisch?" [ref=f2e458] [cursor=pointer]:
            - generic [ref=f2e460]: +
          - paragraph [ref=f2e463]: Nein. Die Qualität der Erkennung hängt von Lesbarkeit, Maßstab, Planaufbau und enthaltenen Informationen ab. Erkannte Räume und Geometrien müssen vor der Berechnung kontrolliert und bei Bedarf korrigiert werden.
        - generic [ref=f2e464]:
          - button "Ist ein Einfamilienhaus immer in unter 7 Minuten berechnet?" [ref=f2e465] [cursor=pointer]:
            - generic [ref=f2e467]: +
          - paragraph [ref=f2e470]: Nein. Unter sieben Minuten ist ein Beispielwert für ein typisches Einfamilienhaus mit geeignetem PDF-Grundriss. Planqualität, Gebäudeumfang und notwendiger Korrekturbedarf beeinflussen die tatsächliche Dauer.

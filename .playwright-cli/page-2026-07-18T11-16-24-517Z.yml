            - generic [ref=f3e39]:
              - heading "Raumweise Heizlast" [level=3] [ref=f3e40]
              - paragraph [ref=f3e41]: Verstehen, welche Raum- und Bauteildaten entlang der DIN EN 12831 in die Berechnung einfließen.

            - heading "Zusammenhänge statt isolierter Eingabemasken." [level=2] [ref=f3e81]
            - paragraph [ref=f3e82]: Lernende sehen nicht nur ein Endergebnis. Sie verfolgen, wie Grundriss, Raumgeometrie, Bauteile und Systemdaten zusammenwirken und wo fachliche Kontrolle nötig ist.

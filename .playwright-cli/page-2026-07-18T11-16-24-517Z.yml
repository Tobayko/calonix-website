            - paragraph [ref=f3e61]: Einen geeigneten, lesbaren Grundriss als gemeinsame Ausgangslage verwenden.
          - article [ref=f3e62]:
            - heading "Räume automatisch erkennen" [level=3] [ref=f3e63]
            - paragraph [ref=f3e64]: Erkannte Raumstrukturen und Planinformationen gemeinsam bewerten.

            - listitem [ref=f3e85]: Automatische Erkennung kritisch prüfen statt ungeprüft übernehmen
            - listitem [ref=f3e86]: Auswirkungen von Korrekturen auf Folgeergebnisse vergleichen
            - listitem [ref=f3e87]: Grenzen, Unsicherheiten und fachliche Verantwortung benennen

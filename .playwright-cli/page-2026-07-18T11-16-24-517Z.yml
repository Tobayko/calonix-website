          - heading "Vom Plan zur begründeten fachlichen Entscheidung." [level=2] [ref=f3e56]
          - paragraph [ref=f3e57]: Der PDF-Grundriss bildet eine gemeinsame Projektbasis. Lernende prüfen die erkannten Daten und sehen anschließend, welche Folgen Korrekturen für Berechnung und Auslegung haben.
        - generic [ref=f3e58]:
          - article [ref=f3e59]:

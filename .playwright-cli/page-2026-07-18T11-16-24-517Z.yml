          - generic [ref=f3e75]: 1 Projekt
          - paragraph [ref=f3e76]: Ein geeigneter Einfamilienhaus-Grundriss verbindet Aufmaß, Heizlast, Material und Abgleich in einer durchgängigen Aufgabe.
          - paragraph [ref=f3e77]: Automatisch erkannte Angaben sind Vorschläge. Sie müssen im Unterricht und im realen Projekt fachlich kontrolliert werden.

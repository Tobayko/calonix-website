          - button "Orientiert sich Prometo an der DIN EN 12831?" [ref=f5e423] [cursor=pointer]:
            - generic [ref=f5e425]: +
          - paragraph [ref=f5e428]: Prometo kann Eingaben und Prüfschritte entlang der DIN EN 12831 strukturieren. Eine Garantie auf DIN-Konformität wird nicht behauptet; Berechnung und Bewertung müssen qualifizierte Personen fachlich prüfen.
        - generic [ref=f5e429]:
          - button "Wie funktioniert der PDF-Import für Baupläne?" [ref=f5e430] [cursor=pointer]:
            - generic [ref=f5e432]: +
          - paragraph [ref=f5e435]: Du wählst einen PDF-Bauplan aus und prüfst die daraus übernommenen Raumdaten vor der weiteren Verwendung. Je nach Planqualität bleiben manuelle Korrekturen Teil des Workflows.
        - generic [ref=f5e436]:
          - button "Erkennt Prometo jeden PDF-Grundriss automatisch?" [ref=f5e437] [cursor=pointer]:
            - generic [ref=f5e439]: +
          - paragraph [ref=f5e442]: Nein. Die Qualität der Erkennung hängt von Lesbarkeit, Maßstab, Planaufbau und enthaltenen Informationen ab. Erkannte Räume und Geometrien müssen vor der Berechnung kontrolliert und bei Bedarf korrigiert werden.
        - generic [ref=f5e443]:
          - button "Ist ein Einfamilienhaus immer in unter 7 Minuten berechnet?" [ref=f5e444] [cursor=pointer]:
            - generic [ref=f5e446]: +
          - paragraph [ref=f5e449]: Nein. Unter sieben Minuten ist ein Beispielwert für ein typisches Einfamilienhaus mit geeignetem PDF-Grundriss. Planqualität, Gebäudeumfang und notwendiger Korrekturbedarf beeinflussen die tatsächliche Dauer.
        - generic [ref=f5e450]:
          - button "Berechnet Prometo nur die Heizlast?" [ref=f5e451] [cursor=pointer]:
            - generic [ref=f5e453]: +
          - paragraph [ref=f5e456]: Nein. Die geprüften Raumdaten werden für Materialberechnung, Flächenheizung und hydraulischen Abgleich weiterverwendet. Dadurch müssen Projektinformationen nicht für jeden Folgeschritt neu erfasst werden.
        - generic [ref=f5e457]:

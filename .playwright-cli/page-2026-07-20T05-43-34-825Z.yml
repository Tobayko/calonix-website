            - generic [ref=e496]: +
          - paragraph [ref=e499]: Nein. Die Qualität der Erkennung hängt von Lesbarkeit, Maßstab, Planaufbau und enthaltenen Informationen ab. Erkannte Räume und Geometrien müssen vor der Berechnung kontrolliert und bei Bedarf korrigiert werden.
        - generic [ref=e500]:
          - button "Ist ein Einfamilienhaus immer in unter 7 Minuten berechnet?" [ref=e501] [cursor=pointer]:
            - generic [ref=e503]: +
          - paragraph [ref=e506]: Nein. Unter sieben Minuten ist ein Beispielwert für ein typisches Einfamilienhaus mit geeignetem PDF-Grundriss. Planqualität, Gebäudeumfang und notwendiger Korrekturbedarf beeinflussen die tatsächliche Dauer.
        - generic [ref=e507]:
          - button "Berechnet Prometo nur die Heizlast?" [ref=e508] [cursor=pointer]:
            - generic [ref=e510]: +
          - paragraph [ref=e513]: Nein. Die geprüften Raumdaten werden für Materialberechnung, Flächenheizung und hydraulischen Abgleich weiterverwendet. Dadurch müssen Projektinformationen nicht für jeden Folgeschritt neu erfasst werden.
        - generic [ref=e514]:
          - button "Wann kann ich Prometo nutzen?" [ref=e515] [cursor=pointer]:
            - generic [ref=e517]: +
          - paragraph [ref=e520]: Prometo befindet sich in der kostenlosen Beta. SHK-Betriebe können die Software mit einem echten Projekt testen und Feedback zu Raumerkennung, Berechnung, Bedienung und Ergebnissen geben.

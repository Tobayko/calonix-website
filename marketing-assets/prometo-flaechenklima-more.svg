  <!-- INSTAGRAM POST: PLAN WITH CONFIDENCE -->
  <g id="Instagram_Post_Planung_1080x1080" transform="translate(2480 480)">
    <rect width="1080" height="1080" rx="32" fill="#111414"/>
    <rect x="32" y="32" width="1016" height="1016" rx="24" fill="none" stroke="#242A2A" stroke-width="2"/>
